<body>
<div id="book"></div>
<div id="src"><!--SOURCE--></div>
<script>
const MM = 96 / 25.4;
const MIN_GAP = 30 * MM;
const book = document.getElementById('book');
const report = { notes: [], gaps: [], splitTables: [], splitParas: 0, splitLists: 0, scaledFigs: [] };
let pages = [];

function el(tag, cls, htmlStr) { const e = document.createElement(tag); if (cls) e.className = cls; if (htmlStr != null) e.innerHTML = htmlStr; return e; }

function newPage(hdrRight) {
  const p = el('div', 'page');
  p.innerHTML = `<div class="hdr"><span><b>The Australian Freight Playbook</b> · Volume 2</span><span>${hdrRight}</span></div><div class="body"></div><div class="ftr"><span>Review draft · November 2026 edition · CC BY NC 4.0</span><span class="pn"></span></div>`;
  book.appendChild(p); pages.push(p);
  return p.querySelector('.body');
}
function overflow(body) { return body.scrollHeight > body.clientHeight + 1; }
function used(body) {
  const last = body.lastElementChild; if (!last) return 0;
  const br = body.getBoundingClientRect(), lr = last.getBoundingClientRect();
  const mb = parseFloat(getComputedStyle(last).marginBottom) || 0;
  return lr.bottom - br.top + mb;
}
function remaining(body) { return body.clientHeight - used(body); }
let curChapter = '', curPart = null;
function justify(body, r) {
  const kids = Array.from(body.children);
  const elig = kids.filter((c, k) => k > 0 && !isKeepNext(kids[k - 1]) && !c.classList.contains('notes'));
  if (!elig.length) return 0;
  const each = Math.min(12 * MM, r / elig.length) - 0.5;
  if (each <= 0) return 0;
  elig.forEach(c => { const mt = parseFloat(getComputedStyle(c).marginTop) || 0; c.style.marginTop = (mt + each) + 'px'; });
  if (overflow(body)) { elig.forEach(c => c.style.marginTop = ''); return 0; }
  return each * elig.length;
}
function notesPanel(body, r) {
  const n = el('div', 'notes', `<div class="nt">Your Notes${curChapter ? ' · ' + curChapter.replace(/:.*/, '') : ''}</div><div class="np">Space for your own rates, contacts and site details${curChapter ? ' for ' + curChapter.replace(/^Chapter \d+:\s*/, '') : ''}.</div>`);
  n.style.height = (r - 3 * MM - 2) + 'px';
  body.appendChild(n);
  if (overflow(body)) n.style.height = (r - 3 * MM - 12) + 'px';
  return n;
}
function fillGap(body, partEnd) {
  let r = remaining(body);
  if (!body.children.length) return;
  if (partEnd && r >= 45 * MM && curPart) {
    const rows = curPart._chapters.filter(h => /^Chapter/.test(h.textContent));
    const g = el('div', 'glance', `<div class="gt">Part ${curPart.dataset.part} at a Glance</div>` +
      rows.map(h => `<div class="gr"><span>${h.textContent}</span><span class="tp" data-ref="${h.dataset.ref}"></span></div>`).join('') +
      `<div class="gn">Every chapter points to a free workbook. Part G lists all 28 tools and when each one needs its figures rechecked.</div>`);
    body.appendChild(g);
    if (overflow(body)) g.remove(); else r = remaining(body);
  }
  if (r >= 30 * MM) {
    notesPanel(body, r);
    report.notes.push({ page: pages.length, mm: Math.round(r / MM) });
  } else {
    const took = r > 2 * MM ? justify(body, r) : 0;
    report.gaps.push({ page: pages.length, mm: Math.round((r - took) / MM) });
  }
}
function isKeepNext(b) {
  if (!b) return false;
  if (/^H[1-4]$/.test(b.tagName)) return true;
  if (b.classList.contains('leadin') || b.classList.contains('toc-part')) return true;
  if (b.tagName === 'P' && /:\s*$/.test(b.textContent.trim()) && b.textContent.length < 400) return true;
  return false;
}
function splitList(body, list) {
  const items = Array.from(list.children);
  if (items.length < 2) return false;
  const clone = list.cloneNode(false);
  body.appendChild(clone);
  let moved = 0;
  for (const li of items) {
    clone.appendChild(li);
    if (overflow(body)) { list.insertBefore(li, list.firstChild); break; }
    moved++;
  }
  const minEach = items.length >= 4 ? 2 : 1;
  if (moved < minEach || (items.length - moved > 0 && items.length - moved < minEach)) {
    // undo
    while (clone.firstChild) list.insertBefore(clone.lastChild, list.firstChild);
    clone.remove();
    return false;
  }
  if (list.children.length === 0) return null;
  if (list.tagName === 'OL') {
    const start = parseInt(list.getAttribute('start') || '1', 10);
    clone.setAttribute('start', start);
    list.setAttribute('start', start + moved);
  }
  report.splitLists++;
  return list;
}
function splitPara(body, p) {
  const text = p.innerHTML;
  if (p.textContent.length < 360) return false;
  // split on word boundaries in the HTML, outside tags
  const tokens = text.split(/(\s+)/);
  const clone = p.cloneNode(false);
  body.appendChild(clone);
  let lo = 0, hi = tokens.length, best = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    clone.innerHTML = tokens.slice(0, mid).join('');
    if (!overflow(body)) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
  }
  // avoid cutting inside a tag
  while (best > 0 && /<[^>]*$/.test(tokens.slice(0, best).join(''))) best--;
  const head = tokens.slice(0, best).join('');
  const tail = tokens.slice(best).join('');
  const headText = head.replace(/<[^>]+>/g, ''), tailText = tail.replace(/<[^>]+>/g, '');
  if (headText.length < 170 || tailText.length < 170) { clone.remove(); return false; }
  clone.innerHTML = head;
  const rest = p.cloneNode(false); rest.innerHTML = tail.trim(); rest.classList.add('cont-para');
  report.splitParas++;
  return rest;
}
function splitTable(body, table) {
  const thead = table.querySelector('thead');
  const rows = Array.from(table.querySelectorAll('tbody tr'));
  const t1 = table.cloneNode(false); if (thead) t1.appendChild(thead.cloneNode(true));
  const tb1 = el('tbody'); t1.appendChild(tb1); body.appendChild(t1);
  let moved = 0;
  for (const r of rows) { tb1.appendChild(r); if (overflow(body)) { tb1.removeChild(r); break; } moved++; }
  if (moved < 3) { t1.remove(); rows.forEach(r => table.querySelector('tbody').appendChild(r)); return false; }
  const rest = table.cloneNode(false); rest.classList.add('cont');
  const cap = el('caption', null, 'continued'); rest.appendChild(cap);
  if (thead) rest.appendChild(thead.cloneNode(true));
  const tb2 = el('tbody'); rest.appendChild(tb2);
  rows.slice(moved).forEach(r => tb2.appendChild(r));
  report.splitTables.push(pages.length);
  return rest;
}

function shrinkToFit(body, group) {
  const last = group[group.length - 1];
  if (last.tagName === 'TABLE') {
    last.classList.add('tight');
    if (!overflow(body)) { report.tight = (report.tight || 0) + 1; return true; }
    last.classList.remove('tight');
    if (body.children.length <= group.length) { last.classList.add('tighter'); if (!overflow(body)) { report.tight = (report.tight || 0) + 1; return true; } last.classList.remove('tighter'); }
    return false;
  }
  if (last.tagName === 'FIGURE') {
    const img = last.querySelector('img');
    const w0 = img.getBoundingClientRect().width;
    for (let f = 0.95; f >= 0.72; f -= 0.03) {
      img.style.width = (w0 * f) + 'px'; img.style.margin = '0 auto';
      if (!overflow(body)) { report.scaledFigs.push(pages.length); return true; }
    }
    img.style.width = ''; img.style.margin = ''; return false;
  }
  return false;
}
function paginateBlocks(blocks, hdrRight, firstBody) {
  let body = firstBody || newPage(hdrRight);
  let i = 0, guard = 0;
  while (i < blocks.length && guard++ < 5000) {
    let j = i; const group = [blocks[i]];
    while (isKeepNext(blocks[j]) && j + 1 < blocks.length) { j++; group.push(blocks[j]); }
    group.forEach(g => body.appendChild(g));
    if (!overflow(body)) { group.forEach(g => { if (g.tagName === 'H2') curChapter = g.textContent; }); i = j + 1; continue; }
    // try a tighter table or a smaller figure before moving it
    if (shrinkToFit(body, group)) { group.forEach(g => { if (g.tagName === 'H2') curChapter = g.textContent; }); i = j + 1; continue; }
    group.forEach(g => g.remove());
    const last = group[group.length - 1];
    const heads = group.slice(0, -1);
    // float: let the text that follows a table or figure in the same section fill this page first
    if (['TABLE', 'FIGURE'].includes(last.tagName) && body.children.length && remaining(body) >= 25 * MM) {
      let k = j + 1, pulled = 0;
      while (k < blocks.length) {
        const b = blocks[k];
        if (!['P', 'UL', 'OL'].includes(b.tagName) || isKeepNext(b)) break;
        body.appendChild(b);
        if (!overflow(body)) { blocks.splice(k, 1); pulled++; continue; }
        b.remove();
        const rest = b.tagName === 'P' ? splitPara(body, b) : splitList(body, b);
        if (rest !== false) { blocks.splice(k, 1); if (rest) blocks.splice(j + 1, 0, rest); pulled++; }
        break;
      }
      if (pulled) report.floats = (report.floats || 0) + 1;
    }
    // try to split the last block, keeping its heading with the part that stays
    let rest = false;
    if (['UL', 'OL', 'P'].includes(last.tagName) || (last.tagName === 'TABLE' && body.children.length === 0 && heads.length === 0)) {
      heads.forEach(h => body.appendChild(h));
      if (last.tagName === 'P') rest = splitPara(body, last);
      else if (last.tagName === 'TABLE') rest = splitTable(body, last);
      else rest = splitList(body, last);
      if (rest === false) heads.forEach(h => h.remove());
    }
    if (rest !== false) {
      if (rest) { blocks[j] = rest; i = j; } else { i = j + 1; }
      fillGap(body); body = newPage(hdrRight); continue;
    }
    if (body.children.length === 0) {
      // too tall for an empty page
      if (last.tagName === 'TABLE') {
        heads.forEach(h => body.appendChild(h));
        const r = splitTable(body, last);
        if (r) { blocks[j] = r; i = j; body = newPage(hdrRight); continue; }
      }
      if (last.tagName === 'FIGURE') {
        heads.forEach(h => body.appendChild(h));
        body.appendChild(last);
        const img = last.querySelector('img');
        let h = img.getBoundingClientRect().height;
        while (overflow(body) && h > 200) { h -= 10; img.style.height = h + 'px'; img.style.width = 'auto'; img.style.maxWidth = '100%'; img.style.margin = '0 auto'; }
        report.scaledFigs.push(pages.length);
        i = j + 1; fillGap(body); body = newPage(hdrRight); continue;
      }
      // place anyway
      group.forEach(g => body.appendChild(g)); i = j + 1; fillGap(body); body = newPage(hdrRight); continue;
    }
    fillGap(body); body = newPage(hdrRight);
  }
  return body;
}

async function run() {
  await document.fonts.ready;
  await Promise.all(Array.from(document.images).map(im => im.decode().catch(() => {})));
  const parts = Array.from(document.querySelectorAll('#src section.part'));
  // cover
  const cover = el('div', 'page cover');
  cover.innerHTML = `<div class="inner"><div class="kick">Volume 2 · November 2026 edition</div><div class="t1">The Australian<br>Freight<br>Playbook</div><div class="t2">Shipping, driving, running and growing a freight business in every state and territory</div><div class="bar"></div><div class="sub">One book for the three people every consignment depends on: the shipper who buys it, the driver who moves it and the operator who runs the trucks. Plain words, checked figures, and 28 free tools.</div><div class="grid">${parts.map(s => `<div><b>${s.dataset.part}</b>${s.dataset.title}</div>`).join('')}</div><div class="foot"><span>November 2026 edition · Review draft</span><span>Free to share with credit, not for sale · CC BY NC 4.0</span></div></div>`;
  book.appendChild(cover); pages.push(cover);
  // contents
  const toc = [el('h2', null, 'Contents')];
  const tocRefs = [];
  parts.forEach(s => {
    const pr = el('div', 'toc-part', `<span>Part ${s.dataset.part}: ${s.dataset.title}</span><span class="tp"></span>`);
    toc.push(pr); tocRefs.push({ row: pr, target: s, kind: 'part' });
    s._chapters = Array.from(s.querySelectorAll(':scope > h2')).map(h => ({ textContent: h.textContent, dataset: h.dataset }));
    s.querySelectorAll(':scope > h2').forEach((h, k) => {
      h.dataset.ref = s.dataset.part + k;
      const r = el('div', 'toc-row', `<span>${h.textContent}</span><span class="tp"></span>`);
      toc.push(r); tocRefs.push({ row: r, ref: h.dataset.ref });
    });
  });
  paginateBlocks(toc, 'Contents');
  // parts
  const partStart = {};
  for (const s of parts) {
    curPart = s; curChapter = '';
    const body = newPage(`Part ${s.dataset.part}: ${s.dataset.title}`);
    partStart[s.dataset.part] = pages.length;
    const op = el('div', 'opener', `<div class="big">${s.dataset.part}</div><div class="tag">Part ${s.dataset.part}</div><div class="ttl">${s.dataset.title}</div><div class="aud">${s.dataset.aud}</div>`);
    body.appendChild(op);
    const blocks = Array.from(s.children);
    const lastBody = paginateBlocks(blocks, `Part ${s.dataset.part}: ${s.dataset.title}`, body);
    fillGap(lastBody, true);
  }
  // page numbers
  pages.forEach((p, k) => { const pn = p.querySelector('.pn'); if (pn) pn.textContent = k + 1; });
  // toc numbers
  const pageOf = node => pages.findIndex(p => p.contains(node)) + 1;
  tocRefs.forEach(t => {
    let n;
    if (t.kind === 'part') n = partStart[t.target.dataset.part];
    else { const h = book.querySelector(`h2[data-ref="${t.ref}"]`); n = h ? pageOf(h) : '?'; }
    t.row.querySelector('.tp').textContent = n;
  });
  book.querySelectorAll('.glance .tp').forEach(t => { const h = book.querySelector(`#book h2[data-ref="${t.dataset.ref}"]`); t.textContent = h ? pageOf(h) : ''; });
  // empty last page cleanup
  pages = pages.filter(p => { const b = p.querySelector('.body'); if (b && b.children.length === 0) { p.remove(); return false; } return true; });
  report.pages = pages.length;
  window.__report = report;
  window.__done = true;
}
window.addEventListener('load', run);
</script>
</body>
</html>
